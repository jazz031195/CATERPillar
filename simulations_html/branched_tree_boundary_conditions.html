<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Branched vessel tree — boundary condition simulation</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e8e9ec; --text-dim:#9aa0ac;
    --accent:#3b8ad4; --vessel:#c0392b; --vessel-light:#e07a5f; --mirror:#8e6fce;
    --boundary:#666f7f; --particle:#ffd54a;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:960px; margin:0 auto; padding:20px;}
  h1{font-size:16px; font-weight:600; margin:0 0 4px;}
  p.sub{font-size:13px; color:var(--text-dim); margin:0 0 16px; line-height:1.5;}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px;}
  .controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px;}
  .modebtns{display:flex; gap:6px;}
  button{
    background:#1f2430; border:1px solid var(--border); color:var(--text);
    padding:7px 12px; border-radius:7px; font-size:13px; cursor:pointer;
  }
  button.active{border-color:var(--accent); background:#1a2c40; color:#bfe0ff;}
  button:hover{border-color:#4a5262;}
  .slider-group{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim);}
  input[type=range]{width:120px;}
  #playpause{margin-left:auto;}
  canvas{width:100%; height:auto; display:block; border-radius:8px; background:#0a0c10; border:1px solid var(--border);}
  .legend{display:flex; gap:18px; margin-top:12px; font-size:12px; color:var(--text-dim); flex-wrap:wrap;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .swatch{width:14px; height:3px; border-radius:2px; display:inline-block;}
  .caption{font-size:13px; color:var(--text-dim); line-height:1.6; margin-top:14px; padding-top:12px; border-top:1px solid var(--border);}
  .caption b{color:var(--text); font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Branched vessel tree with mirrored unit cell</h1>
  <p class="sub">A tapering arterial tree (Murray's law) on the left, its mirror-image copy on the right, joined at a dashed boundary. Switch modes to see how the boundary treatment changes whether flow actually crosses.</p>

  <div class="panel">
    <div class="controls">
      <div class="modebtns">
        <button id="btn-dead" onclick="setMode('dead')">Dead end</button>
        <button id="btn-sym" onclick="setMode('sym')">Symmetry</button>
        <button id="btn-per" onclick="setMode('per')">Periodic</button>
      </div>
      <div class="slider-group">
        <label>Speed</label>
        <input type="range" id="speed" min="20" max="200" value="80">
      </div>
      <div class="slider-group">
        <label>Particles</label>
        <input type="range" id="count" min="4" max="24" value="12">
      </div>
      <button id="playpause" onclick="togglePlay()">Pause</button>
    </div>

    <canvas id="c" width="920" height="440"></canvas>

    <div class="legend">
      <span><span class="swatch" style="background:var(--vessel)"></span>original tree</span>
      <span><span class="swatch" style="background:var(--mirror)"></span>mirrored tree</span>
      <span><span class="swatch" style="background:var(--boundary); height:2px; border-top:2px dashed var(--boundary); background:none;"></span>boundary</span>
      <span><span class="swatch" style="background:var(--particle); border-radius:50%; width:8px; height:8px;"></span>flow marker</span>
    </div>

    <div class="caption" id="caption"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- Build the tree ----------
const maxDepth = 4;
const spreadAngle = 0.52;
const lengthFactor = 0.74;
const radiusFactor = Math.pow(2, -1/3); // Murray's law, symmetric bifurcation

let nodeId = 0;
function buildTree(x, y, angle, length, radius, depth, parent) {
  const node = { id: nodeId++, x, y, radius, depth, parent, children: [] };
  if (parent) parent.children.push(node);
  if (depth < maxDepth) {
    const x2a = x + length*Math.cos(angle+spreadAngle), y2a = y + length*Math.sin(angle+spreadAngle);
    const x2b = x + length*Math.cos(angle-spreadAngle), y2b = y + length*Math.sin(angle-spreadAngle);
    buildTree(x2a, y2a, angle+spreadAngle*0.72, length*lengthFactor, radius*radiusFactor, depth+1, node);
    buildTree(x2b, y2b, angle-spreadAngle*0.72, length*lengthFactor, radius*radiusFactor, depth+1, node);
  }
  return node;
}

const root = buildTree(70, H/2, 0, 92, 11, 0, null);

let allNodes = [];
let leaves = [];
(function collect(n){ allNodes.push(n); if(n.children.length===0) leaves.push(n); else n.children.forEach(collect); })(root);

let maxX = Math.max(...allNodes.map(n=>n.x));
const boundaryX = maxX + 14;

function mirrorX(x){ return 2*boundaryX - x; }

// root-to-leaf point path (original coords)
function pathToLeaf(leaf){
  const pts = [];
  let n = leaf;
  while(n){ pts.push(n); n = n.parent; }
  return pts.reverse(); // root -> leaf
}

// ---------- Rendering ----------
function drawTree(node, mirror){
  node.children.forEach(child=>{
    ctx.beginPath();
    ctx.moveTo(mirror? mirrorX(node.x): node.x, node.y);
    ctx.lineTo(mirror? mirrorX(child.x): child.x, child.y);
    ctx.strokeStyle = mirror ? getCss('--mirror') : getCss('--vessel');
    ctx.lineWidth = Math.max(1.2, child.radius*1.15);
    ctx.lineCap = 'round';
    ctx.stroke();
    drawTree(child, mirror);
  });
}

function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function drawBoundary(mode){
  ctx.save();
  ctx.strokeStyle = getCss('--boundary');
  ctx.setLineDash([6,5]);
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(boundaryX, 20);
  ctx.lineTo(boundaryX, H-20);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = getCss('--text-dim');
  ctx.font = '11px sans-serif';
  const label = mode==='dead' ? 'wall' : mode==='sym' ? 'symmetry plane' : 'periodic boundary';
  ctx.fillText(label, boundaryX+6, 32);
}

// ---------- Particle paths per mode ----------
function buildFullPath(leaf, mode){
  const orig = pathToLeaf(leaf).map(n=>({x:n.x, y:n.y})); // root -> leaf
  if(mode==='dead') return orig;
  const reversed = [...orig].reverse(); // leaf -> root
  if(mode==='sym') return orig.concat(reversed.slice(1)); // bounce back same tree
  // periodic: continue into mirrored tree
  const mirrored = reversed.map(p=>({x: mirrorX(p.x), y: p.y}));
  return orig.concat(mirrored);
}

function pathLength(path){
  let d=0; for(let i=1;i<path.length;i++){ d+=Math.hypot(path[i].x-path[i-1].x, path[i].y-path[i-1].y); }
  return d;
}
function pointAtDistance(path, dist){
  let remaining = dist;
  for(let i=1;i<path.length;i++){
    const segLen = Math.hypot(path[i].x-path[i-1].x, path[i].y-path[i-1].y);
    if(remaining <= segLen){
      const t = segLen===0?0:remaining/segLen;
      return { x: path[i-1].x + (path[i].x-path[i-1].x)*t, y: path[i-1].y + (path[i].y-path[i-1].y)*t };
    }
    remaining -= segLen;
  }
  return path[path.length-1];
}

// ---------- Simulation state ----------
let mode = 'per';
let playing = true;
let particles = [];

function makeParticles(n, m){
  particles = [];
  for(let i=0;i<n;i++){
    const leaf = leaves[Math.floor(Math.random()*leaves.length)];
    const path = buildFullPath(leaf, m);
    const len = pathLength(path);
    particles.push({ path, len, dist: Math.random()*len, alive:true, speedMul: 0.75+Math.random()*0.6 });
  }
}

const captions = {
  dead: "<b>Dead end.</b> Each terminal branch is a wall. Flow reaches the leaf tips and stops there — no mass leaves the domain, so without an outlet condition, steady flow through the tree can't be sustained.",
  sym: "<b>Symmetry (mirror) plane.</b> Normal velocity at each leaf is forced to zero, so flow reflects and retraces its path back down the same branch. It looks livelier than a dead end, but net flux across the boundary is still zero — it's not a real outlet.",
  per: "<b>Periodic boundary.</b> Flow exits a leaf on the original tree and re-enters at the mirrored leaf on the other side, continuing in the same direction. This is the valid way to use mirrored geometry: it sustains real net flow across the boundary, representing a repeating unit of a larger network."
};

function setMode(m){
  mode = m;
  document.getElementById('caption').innerHTML = captions[m];
  ['dead','sym','per'].forEach(k=>{
    document.getElementById('btn-'+k).classList.toggle('active', k===m);
  });
  const count = parseInt(document.getElementById('count').value,10);
  makeParticles(count, m);
}

document.getElementById('count').addEventListener('input', ()=>{
  makeParticles(parseInt(document.getElementById('count').value,10), mode);
});

function togglePlay(){
  playing = !playing;
  document.getElementById('playpause').textContent = playing ? 'Pause' : 'Play';
}

// ---------- Animation loop ----------
let lastT = performance.now();
function frame(t){
  const dt = Math.min(0.05, (t-lastT)/1000);
  lastT = t;
  const speed = parseInt(document.getElementById('speed').value,10);

  if(playing){
    particles.forEach(p=>{
      if(!p.alive) return;
      p.dist += speed*p.speedMul*dt;
      if(p.dist >= p.len){
        if(mode==='dead'){ p.alive = false; }
        else { p.dist = p.dist % p.len; }
      }
    });
    // respawn dead-end particles after a short pause
    if(mode==='dead' && Math.random() < 0.02){
      const deadOnes = particles.filter(p=>!p.alive);
      if(deadOnes.length){
        const p = deadOnes[Math.floor(Math.random()*deadOnes.length)];
        const leaf = leaves[Math.floor(Math.random()*leaves.length)];
        p.path = buildFullPath(leaf,'dead'); p.len = pathLength(p.path); p.dist = 0; p.alive = true;
      }
    }
  }

  ctx.clearRect(0,0,W,H);
  drawTree(root, false);
  if(mode==='per') drawTree(root, true);
  drawBoundary(mode);

  particles.forEach(p=>{
    if(!p.alive) return;
    const pt = pointAtDistance(p.path, p.dist);
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 4, 0, Math.PI*2);
    ctx.fillStyle = getCss('--particle');
    ctx.fill();
  });

  requestAnimationFrame(frame);
}

setMode('per');
requestAnimationFrame(frame);
</script>
</body>
</html>
